name: Package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@simeoncalixte'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Pack the built library
        run: npm pack --ignore-scripts --json > package-artifact.json
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'const p=require("./package.json"); if (process.env.GITHUB_REF_NAME !== "v"+p.version) throw new Error("Tag must match package.json version");'
      - name: Publish private GitHub package
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish "$(node -p 'require("./package-artifact.json")[0].filename')" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
